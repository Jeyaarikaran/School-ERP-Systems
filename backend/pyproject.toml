[project]
name = "school-erp-backend"
version = "0.1.0"
description = "Multi-tenant School ERP Backend — FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.1.0",

    # Redis
    "redis[hiredis]>=5.1.0",

    # Celery
    "celery[redis]>=5.4.0",
    "celery-redbeat>=2.2.0",

    # Auth
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",

    # Logging
    "structlog>=24.4.0",

    # HTTP client (for webhooks, external APIs)
    "httpx>=0.27.0",

    # Object storage
    "boto3>=1.35.0",

    # Utilities
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "python-dateutil>=2.9.0",

    # Observability
    "sentry-sdk>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert used in tests
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no DB, no Redis)",
    "integration: Integration tests (DB + Redis required)",
    "e2e: End-to-end API tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
